{% extends "base.html" %}
{% block content %}

<h2>Crear cuenta de usuario</h2>
<p class="subtexto">Regístrate como usuario para consultar el catálogo, pedir préstamos y enviar preguntas al administrador.</p>

<form action="{{ url_for('registro') }}" method="POST" class="form-login">
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Pérez" required>

    <label for="id_usuario">Matrícula o ID</label>
    <input type="text" id="id_usuario" name="id_usuario" placeholder="Ej. 26-1234" required>

    <label for="email">Correo</label>
    <input type="text" id="email" name="email" placeholder="correo@ejemplo.com">

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" placeholder="Contraseña" required>

    <button type="submit">Registrarme</button>
</form>

<p class="subtexto">
    Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
</p>

{% endblock %}
