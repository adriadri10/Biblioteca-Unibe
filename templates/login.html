{% extends "base.html" %}
{% block content %}

<h2>Iniciar sesión</h2>
<p class="subtexto">Solo el personal de la biblioteca necesita iniciar sesión para
    prestar, devolver o agregar libros. Cualquiera puede ver el catálogo y los usuarios.</p>

<form action="{{ url_for('login') }}" method="POST" class="form-login">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" placeholder="ej. jhuliana" required autofocus>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" placeholder="Contraseña" required>

    <button type="submit">Entrar</button>
</form>

<p class="subtexto">Usuarios de prueba: <code>jhuliana</code> / <code>adrielys</code>,
    contraseña: <code>biblioteca26</code></p>

{% endblock %}
